minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20260905.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20260905.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20260905.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20260905.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20260905.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20260905.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20260905.1'
  - typescript@7.1.0-dev.20260905.1

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

overrides:
  # Keep the fixture compiler on the current semver package.
  '@babel/core@7>semver': ^7.7.4
  '@babel/helper-compilation-targets@7>semver': ^7.7.4
  # Fix GHSA-238p-pmpm-9mq7 in Markdown linting's transitive math renderer.
  micromark-extension-math>katex: ^0.19.0
  # Version 0.0.71 lacks the provenance supplied with 0.0.70.
  volar-service-pug: 0.0.70

allowBuilds:
  esbuild: true
