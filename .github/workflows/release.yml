name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      npmTag: ${{ steps.plan.outputs.npmTag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate package versions
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node --experimental-strip-types scripts/release.ts plan "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get install --yes ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --filter './packages/*' exec publint
      - run: pnpm -r --filter './packages/*' pack --pack-destination "${{ runner.temp }}/ripast-pack"
      - run: npm run smoke:package -- "${{ runner.temp }}/ripast-pack"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: ${{ runner.temp }}/ripast-pack/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Load download tooling from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: ${{ runner.temp }}/ripast-pack
      - name: Publish verified packages through OIDC
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run release:publish -- "$RELEASE_TAG" "${{ runner.temp }}/ripast-pack"
      - name: Download published packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          npm pkg set 'scripts.release:download=node --experimental-strip-types .release-tools/scripts/release.ts download'
          npm run release:download -- "$RELEASE_TAG" "${{ runner.temp }}/ripast-published"
      - name: Check installation from npm
        run: npm run smoke:package -- "${{ runner.temp }}/ripast-published"
