name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node --experimental-strip-types scripts/release.ts plan "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --filter './packages/*' pack --pack-destination "${{ runner.temp }}/ripast-pack"
      - run: npm install --global npm@12
      - name: Publish packages through OIDC
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run release:publish -- "$RELEASE_TAG" "${{ runner.temp }}/ripast-pack"
